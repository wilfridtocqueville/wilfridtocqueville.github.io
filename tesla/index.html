<title>Relevé de consommation</title>
<style>
:root{--fond:#f6f7f9;--carte:#fff;--texte:#1d2330;--doux:#667085;--bord:#e3e6eb;--accent:#c8102e;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--fond:#14161a;--carte:#1d2026;--texte:#e8eaee;--doux:#9aa3b2;--bord:#2e333b;--err:#f97066}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--fond);color:var(--texte)}
main{max-width:1150px;margin:0 auto;padding:24px 16px 60px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:20px}
h1{font-size:20px;margin:0 0 4px}.doux{color:var(--doux)}.petit{font-size:13px}
.defile{overflow-x:auto;margin:16px 0}table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bord);text-align:right;vertical-align:middle}
th{font-size:12px;color:var(--doux);font-weight:600}td.g,th.g{text-align:left}tfoot td{font-weight:700;border-top:2px solid var(--bord)}
td:not(.g){white-space:nowrap}
input{font:inherit;padding:8px 10px;border:1px solid var(--bord);border-radius:7px;background:var(--carte);color:var(--texte);width:100%}
button,.bouton{font:inherit;padding:8px 16px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
#porte{max-width:380px;margin:12vh auto 0}#porte form{display:flex;flex-direction:column;gap:12px}#erreur{color:var(--err);min-height:1.5em}
</style></head>

<script>
const d=JSON.parse(document.getElementById('donnees').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const bouton=document.getElementById('ok'),err=document.getElementById('erreur');
  bouton.disabled=true;bouton.textContent='Ouverture…';err.textContent='';
  try{
    if(!window.crypto||!crypto.subtle)throw new Error('nav');
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('mdp').value),'PBKDF2',false,['deriveKey']);
    const cle=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(d.sel),iterations:d.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const clair=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(d.iv)},cle,b64(d.c))));
    const zone=document.getElementById('contenu');zone.innerHTML=clair.html;zone.hidden=false;
    document.getElementById('porte').remove();
    const lien=document.getElementById('excel');
    if(lien&&clair.xlsx){lien.href=URL.createObjectURL(new Blob([b64(clair.xlsx)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));lien.download=clair.nom_xlsx;}
    else if(lien){lien.remove();}
  }catch(e){
    err.textContent=e.message==='nav'?'Navigateur trop ancien : ouvrez la page avec un navigateur récent.':'Mot de passe incorrect.';
    bouton.disabled=false;bouton.textContent='Ouvrir';
  }
});
</script></body></html>
